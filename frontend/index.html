<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cricket Live Centre</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: #101f33;
      --panel-light: #172a43;
      --text: #f8fafc;
      --muted: #9fb0c7;
      --accent: #43e38b;
      --warning: #fbbf24;
      --danger: #fb7185;
      --border: rgba(159, 176, 199, .18);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top right, #16365a 0, var(--bg) 45%);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .shell { width: min(1040px, 100%); margin: 0 auto; padding: 32px 20px 48px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
    .eyebrow { color: var(--accent); font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(1.8rem, 4vw, 2.8rem); line-height: 1.1; margin-top: 5px; }
    .status { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: .9rem; }
    .status::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--warning); }
    .status.connected::before { background: var(--accent); }
    .status.error::before { background: var(--danger); }
    .layout { display: grid; grid-template-columns: 290px 1fr; gap: 20px; }
    .stack { display: grid; gap: 20px; }
    .panel { background: rgba(16, 31, 51, .9); border: 1px solid var(--border); border-radius: 18px; padding: 20px; box-shadow: 0 18px 50px rgba(0, 0, 0, .18); }
    .panel-title { color: var(--muted); font-size: .82rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 12px; }
    input, select, button { border: 1px solid var(--border); border-radius: 10px; color: var(--text); font: inherit; }
    input, select { width: 100%; background: var(--panel-light); padding: 12px; }
    button { cursor: pointer; background: var(--accent); color: #062016; font-weight: 700; padding: 10px 14px; }
    button:hover { filter: brightness(1.08); }
    button.secondary { background: transparent; color: var(--text); }
    form { display: grid; gap: 10px; }
    form + form { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--border); }
    .scorer-form { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--border); }
    .scorer-form label { color: var(--muted); font-size: .82rem; }
    .checkbox { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: .9rem; }
    .checkbox input { width: auto; }
    .history { display: grid; gap: 10px; margin-top: 14px; }
    .history-item { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px; background: var(--panel-light); border-radius: 12px; }
    .history-item strong { display: block; }
    .history-item span { color: var(--muted); font-size: .9rem; }
    .match-list { display: grid; gap: 10px; margin-top: 18px; }
    .match-hint, .empty, .error { color: var(--muted); font-size: .92rem; }
    .error { color: var(--danger); margin-top: 12px; }
    .score-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .live-badge { color: #052015; background: var(--accent); border-radius: 999px; font-size: .75rem; font-weight: 800; padding: 5px 10px; }
    .teams { color: var(--muted); font-size: 1.05rem; margin-top: 8px; }
    .score { display: flex; align-items: baseline; gap: 10px; margin: 28px 0 22px; }
    .score strong { font-size: clamp(3.2rem, 9vw, 5.5rem); line-height: .9; }
    .score span { color: var(--muted); font-size: 1.05rem; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .stat { background: var(--panel-light); border-radius: 12px; padding: 14px; }
    .stat-label { color: var(--muted); font-size: .78rem; }
    .stat-value { font-size: 1.3rem; font-weight: 700; margin-top: 4px; }
    .commentary { margin-top: 22px; border-top: 1px solid var(--border); padding-top: 18px; }
    .commentary p { color: var(--text); margin-top: 6px; }
    .empty-state { text-align: center; padding: 70px 20px; }
    .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
    @media (max-width: 720px) {
      .shell { padding: 22px 14px 36px; }
      header { align-items: flex-start; flex-direction: column; }
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <div class="eyebrow">Cricket Live Centre</div>
        <h1>Follow every ball</h1>
      </div>
      <div id="connectionStatus" class="status">Connecting to live feed</div>
    </header>

    <div class="layout">
      <aside class="panel">
        <div class="panel-title">Admin access</div>
        <form id="loginForm">
          <input id="email" type="email" placeholder="Admin email" required />
          <input id="password" type="password" placeholder="Password" required />
          <button type="submit">Sign in</button>
        </form>
        <form id="createMatchForm" hidden>
          <div class="panel-title">Add new match</div>
          <input id="teamA" placeholder="Team A" required />
          <input id="teamB" placeholder="Team B" required />
          <input id="venue" placeholder="Venue" required />
          <button type="submit">Create live match</button>
        </form>
        <form id="scorerForm" class="scorer-form" hidden>
          <div class="panel-title">Ball-by-ball scoring</div>
          <label for="delivery">Delivery type</label>
          <select id="delivery">
            <option value="legal">Legal delivery</option>
            <option value="wide">Wide</option>
            <option value="no_ball">No-ball</option>
            <option value="bye">Bye</option>
            <option value="leg_bye">Leg-bye</option>
          </select>
          <input id="ballRuns" type="number" min="0" max="6" value="0" placeholder="Runs" required />
          <label class="checkbox"><input id="wicket" type="checkbox" /> Wicket</label>
          <input id="commentaryInput" placeholder="Commentary" required />
          <button type="submit">Publish ball</button>
        </form>
        <p id="adminMessage" class="match-hint"></p>
        <div class="panel-title">Live matches</div>
        <select id="matchSelect" aria-label="Choose a live match">
          <option>Loading matches...</option>
        </select>
        <p id="matchHint" class="match-hint"></p>
        <div class="match-list">
          <button id="reconnectButton" class="secondary" type="button">Reconnect live feed</button>
        </div>
        <p id="loadError" class="error" hidden></p>
      </aside>

      <section id="scorePanel" class="panel" aria-live="polite">
        <div class="empty-state">
          <div class="icon">🏏</div>
          <h2>Select a match to begin</h2>
          <p class="match-hint">Live score, wickets, and commentary will appear here.</p>
        </div>
      </section>
    </div>
    <section class="panel" style="margin-top: 20px">
      <div class="panel-title">Match history</div>
      <div id="historyList" class="history"><p class="empty">Loading completed matches...</p></div>
    </section>
  </main>

  <script>
    const localFrontend = ["localhost", "127.0.0.1"].includes(window.location.hostname) && window.location.port !== "8000";
    const apiBase = window.location.protocol === "file:" || localFrontend ? "http://127.0.0.1:8000" : window.location.origin;
    const wsBase = apiBase.replace(/^http/, "ws");
    const select = document.getElementById("matchSelect");
    const scorePanel = document.getElementById("scorePanel");
    const status = document.getElementById("connectionStatus");
    const loadError = document.getElementById("loadError");
    const historyList = document.getElementById("historyList");
    const adminMessage = document.getElementById("adminMessage");
    let socket;
    let selectedMatch;
    let adminToken = "";

    function setStatus(text, state = "") {
      status.textContent = text;
      status.className = `status ${state}`;
    }

    function updateScore(state) {
      const runs = document.getElementById("runs");
      if (!runs) return;
      runs.textContent = state.runs;
      document.getElementById("overs").textContent = state.overs;
      document.getElementById("wickets").textContent = state.wickets;
      if (state.last_event) document.getElementById("commentary").textContent = state.last_event;
    }

    function renderMatch(match) {
      selectedMatch = match;
      scorePanel.innerHTML = `
        <div class="score-header">
          <div>
            <div class="eyebrow">Live score</div>
            <h2>${escapeHtml(match.team_a)} vs ${escapeHtml(match.team_b)}</h2>
            <p class="teams">${escapeHtml(match.venue)}</p>
          </div>
          <div>
            <span class="live-badge">LIVE</span>
            <button id="completeMatchButton" class="secondary" type="button" hidden>Complete</button>
          </div>
        </div>
        <div class="score"><strong id="runs">0</strong><span>runs</span></div>
        <div class="stats">
          <div class="stat"><div class="stat-label">Overs</div><div id="overs" class="stat-value">0.0</div></div>
          <div class="stat"><div class="stat-label">Wickets</div><div id="wickets" class="stat-value">0</div></div>
          <div class="stat"><div class="stat-label">Match status</div><div id="matchState" class="stat-value">Live</div></div>
        </div>
        <div class="commentary">
          <div class="panel-title">Latest commentary</div>
          <p id="commentary">Waiting for the first ball...</p>
        </div>`;
      document.getElementById("completeMatchButton").onclick = completeSelectedMatch;
      document.getElementById("completeMatchButton").hidden = !adminToken;
      document.getElementById("scorerForm").hidden = !adminToken;
    }

    async function completeSelectedMatch() {
      if (!selectedMatch) return;
      try {
        await request(`/matches/${selectedMatch.id}/complete`, { method: "POST" });
        if (socket) socket.close();
        adminMessage.textContent = "Match completed and added to history.";
        await Promise.all([loadMatches(), loadHistory()]);
      } catch (error) {
        adminMessage.textContent = error.message;
      }
    }

    async function connect(match) {
      if (!match) return;
      renderMatch(match);
      if (socket) socket.close();
      setStatus("Connecting to live feed");
      socket = new WebSocket(`${wsBase}/ws/match/${encodeURIComponent(match.id)}`);
      socket.onopen = () => setStatus("Live updates connected", "connected");
      socket.onclose = () => setStatus("Live feed disconnected", "error");
      socket.onerror = () => setStatus("Live feed unavailable", "error");
      socket.onmessage = ({ data }) => {
        const event = JSON.parse(data);
        if (event.type === "BALL") {
          updateScore({ runs: event.runs, overs: event.over, wickets: event.wickets, last_event: event.commentary });
        }
        if (event.type === "MATCH_END") {
          document.getElementById("matchState").textContent = "Finished";
          setStatus("Match finished", "connected");
        }
      };
      try {
        updateScore(await request(`/matches/${match.id}/live`));
      } catch (error) {
        document.getElementById("commentary").textContent = error.message;
      }
    }

    async function request(path, options = {}) {
      const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
      if (adminToken) headers.Authorization = `Bearer ${adminToken}`;
      const response = await fetch(`${apiBase}${path}`, { ...options, headers });
      if (!response.ok) {
        const detail = await response.json().catch(() => ({}));
        throw new Error(detail.detail || `Request failed (${response.status})`);
      }
      return response.status === 204 ? null : response.json();
    }

    async function loadMatches() {
      loadError.hidden = true;
      try {
        const matches = await request("/matches/live");
        select.innerHTML = "";
        if (!matches.length) {
          select.innerHTML = "<option>No live matches</option>";
          document.getElementById("matchHint").textContent = "Check back when a match starts.";
          return;
        }
        matches.forEach(match => {
          const option = new Option(`${match.team_a} vs ${match.team_b}`, match.id);
          select.add(option);
        });
        document.getElementById("matchHint").textContent = `${matches.length} live match${matches.length === 1 ? "" : "es"} available`;
        connect(matches[0]);
        select.onchange = () => connect(matches.find(match => match.id === select.value));
      } catch (error) {
        loadError.textContent = error.message;
        loadError.hidden = false;
        select.innerHTML = "<option>Unable to load matches</option>";
        setStatus("Unable to load live feed", "error");
      }
    }

    async function loadHistory() {
      try {
        const matches = await request("/matches/history");
        historyList.innerHTML = matches.length ? matches.map(match => `
          <div class="history-item">
            <div><strong>${escapeHtml(match.team_a)} vs ${escapeHtml(match.team_b)}</strong><span>${escapeHtml(match.venue)}</span></div>
            <span>Completed</span>
          </div>`).join("") : '<p class="empty">No completed matches yet.</p>';
      } catch (error) {
        historyList.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;
      }
    }

    document.getElementById("loginForm").onsubmit = async event => {
      event.preventDefault();
      try {
        const result = await request("/auth/login", { method: "POST", body: JSON.stringify({
          email: document.getElementById("email").value,
          password: document.getElementById("password").value
        }) });
        adminToken = result.access_token;
        document.getElementById("createMatchForm").hidden = false;
        document.getElementById("scorerForm").hidden = !selectedMatch;
        if (selectedMatch) document.getElementById("completeMatchButton").hidden = false;
        adminMessage.textContent = "Signed in. You can create and complete matches.";
      } catch (error) {
        adminMessage.textContent = error.message;
      }
    };

    document.getElementById("createMatchForm").onsubmit = async event => {
      event.preventDefault();
      try {
        await request("/matches/", { method: "POST", body: JSON.stringify({
          team_a: document.getElementById("teamA").value,
          team_b: document.getElementById("teamB").value,
          venue: document.getElementById("venue").value
        }) });
        event.target.reset();
        adminMessage.textContent = "Match created and is now live.";
        await loadMatches();
      } catch (error) {
        adminMessage.textContent = error.message;
      }
    };

    document.getElementById("scorerForm").onsubmit = async event => {
      event.preventDefault();
      if (!selectedMatch) {
        adminMessage.textContent = "Select a live match before publishing a ball.";
        return;
      }
      try {
        await request(`/matches/${selectedMatch.id}/ball`, { method: "POST", body: JSON.stringify({
          delivery: document.getElementById("delivery").value,
          runs: Number(document.getElementById("ballRuns").value),
          wicket: document.getElementById("wicket").checked,
          commentary: document.getElementById("commentaryInput").value
        }) });
        document.getElementById("commentaryInput").value = "";
        document.getElementById("wicket").checked = false;
        adminMessage.textContent = "Ball published to all viewers.";
      } catch (error) {
        adminMessage.textContent = error.message;
      }
    };

    document.getElementById("reconnectButton").onclick = () => connect(selectedMatch);
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char]));
    }
    loadMatches();
    loadHistory();
  </script>
</body>
</html>
